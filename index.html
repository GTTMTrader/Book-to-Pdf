<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="북스캔">
<meta name="theme-color" content="#F4F5F7">
<title>북스캔</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --red:#D0112B;--red2:#E8243C;--redD:#A80C21;--redBg:#FDECEE;
  --bg:#F4F5F7;--card:#fff;--tx:#15171C;--sub:#80868F;--sub2:#A7ACB3;--line:#ECEEF1;
  --green:#18794E;--greenBg:#E8F5EE;--warn:#D98200;--warnBg:#FFF7DE;--warnLine:#F7C948;
  --r:18px;--tab:62px;
  --sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:active{opacity:.65}
button:disabled{opacity:.35}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--st)}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 28px}
/* 탭바 */
#tabbar{height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);background:#fff;border-top:1px solid var(--line);display:flex;flex:none;z-index:10}
#tabbar.off{display:none}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6B7079;font-size:12px;font-weight:600}
#tabbar button.on{color:var(--red)}
#tabbar svg{width:25px;height:25px}
/* 공통 */
.top{display:flex;align-items:center;padding:14px 20px 10px;gap:8px;min-height:58px}
.top h1{font-size:28px;font-weight:800;margin:0;flex:1;letter-spacing:-.5px}
.top h2{font-size:19px;font-weight:800;margin:0;flex:1;text-align:center;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
.ibtn svg{width:26px;height:26px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px #0000000a,0 4px 16px #0000000a}
.sub{color:var(--sub);font-size:14px}
.btnRed{width:100%;height:58px;border-radius:16px;background:var(--red);color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;position:relative;box-shadow:0 6px 18px #d0112b33}
.btnRed .chev{position:absolute;right:20px}
.btnRed svg{width:24px;height:24px}
.btnGray{width:100%;height:52px;border-radius:14px;background:#EEF0F3;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.empty{text-align:center;color:var(--sub);padding:56px 16px;line-height:1.7;font-size:15px}
.secHead{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 12px}
.secHead h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px}
.secHead button{color:var(--sub);font-size:15px;display:flex;align-items:center;gap:2px}
/* 홈 */
.hero{background:linear-gradient(135deg,#FDE6E9 0%,#FFF3F4 60%,#FDEBEE 100%);border-radius:22px;padding:24px 20px 20px;position:relative;overflow:hidden}
.hero h2{margin:0;font-size:31px;line-height:1.25;font-weight:900;letter-spacing:-1px}
.hero h2 em{font-style:normal;color:var(--red)}
.hero p{margin:12px 0 22px;color:#5C6169;font-size:15px;line-height:1.55;max-width:60%}
.hero .ill{position:absolute;right:6px;top:22px;width:150px;height:132px}
.stat{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-top:14px;width:100%;text-align:left}
.stat .ic{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.stat b{font-size:19px;font-weight:800}
.bk{display:flex;gap:16px;padding:16px;margin-bottom:12px;align-items:stretch}
.cov{width:76px;height:104px;border-radius:4px 8px 8px 4px;background:#e9e9ec center/cover no-repeat;flex:none;box-shadow:inset 3px 0 4px #0000001a,0 3px 8px #00000024}
.bk .info{flex:1;min-width:0;display:flex;flex-direction:column}
.bk .t{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px;padding-right:4px}
.bk .d{color:var(--sub);font-size:15px;margin-top:5px}
.bk .row{display:flex;align-items:center;gap:10px;margin-top:auto}
.bar{flex:1;height:5px;background:#F0F1F3;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.bk .pct{font-size:15px;color:#4A4F57;font-weight:600;min-width:42px;text-align:right}
.dots{width:34px;height:28px;display:flex;align-items:center;justify-content:center;color:#3c3f45;flex:none}
.dots svg{width:22px;height:22px}
.search{width:100%;height:46px;border-radius:12px;border:0;background:#fff;padding:0 14px;font:inherit;font-size:16px;margin-bottom:14px;-webkit-user-select:text;user-select:text;box-shadow:0 1px 2px #0000000a}
/* 촬영 */
#cam{background:#1C1916;padding-top:0}
#camHead{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(var(--st) + 6px) 16px 12px;display:flex;align-items:center;background:linear-gradient(#1c1916f0,#1c1916c0);color:#fff}
#camHead .mid{flex:1;text-align:center;min-width:0}
#camHead .mid b{font-size:20px;font-weight:800;display:block}
#camHead .mid span{font-size:12px;color:#ffffffa0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#camHead .cnt{font-size:16px;font-weight:700;min-width:84px;text-align:right}
#camHead .ibtn svg{width:28px;height:28px}
#stage{position:absolute;left:0;right:0;top:0;bottom:150px;background:#000}
#video,#ov{position:absolute;inset:0;width:100%;height:100%}
#video{object-fit:contain}
#ov{touch-action:none;z-index:2}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s;z-index:2}
#camPill{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--st) + 84px);z-index:3;background:#000000a6;color:#fff;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#camPill.ok{color:#7CF0A8}#camPill.wait{color:#FFD27A}
#chips{position:absolute;left:12px;right:12px;bottom:162px;z-index:3;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{background:#000000a6;color:#fff;border-radius:18px;padding:8px 13px;font-size:13px;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip.on{background:#fff;color:var(--red)}
.chip.ins{background:#3a2c0bdd;color:#ffd27a}
#camBot{position:absolute;left:0;right:0;bottom:0;height:150px;background:#2E2925;display:flex;align-items:center;justify-content:space-between;padding:0 34px;z-index:3}
#lastThumb{width:66px;height:66px;border-radius:10px;background:#3b3632 center/cover;border:2px solid #ffffffd0;position:relative}
#lastThumb span{position:absolute;right:-8px;top:-8px;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:2px 6px;display:none}
#shutter{width:92px;height:92px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
#shutter .in{width:70px;height:70px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px #1f1b18}
#ring{position:absolute;inset:0}
#btnTorch{width:66px;height:66px;border-radius:50%;border:1.5px solid #ffffff55;display:flex;align-items:center;justify-content:center;color:#fff}
#btnTorch.on{background:#fff;color:#1c1916}
#btnTorch svg{width:30px;height:30px}
/* 정렬 */
.banner{display:flex;gap:14px;align-items:center;border-radius:16px;padding:16px 18px;margin:2px 0 16px}
.banner.ok{background:var(--greenBg)}
.banner.run{background:#EEF2F7}
.banner.err{background:var(--warnBg)}
.banner .bi{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.banner.ok .bi{background:var(--green)} .banner.run .bi{background:#5B6B82} .banner.err .bi{background:var(--warn)}
.banner .bi svg{width:26px;height:26px;color:#fff}
.banner b{display:block;font-size:19px;font-weight:800;letter-spacing:-.3px}
.banner.ok b{color:var(--green)}
.banner span{display:block;color:#525861;font-size:14px;margin-top:3px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pg{border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 1px 2px #0000000d,0 4px 14px #0000000a;border:2px solid transparent;position:relative}
.pg .im{aspect-ratio:3/3.3;background:#F1F2F4;overflow:hidden;margin:0}
.pg img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pg .ft{display:flex;align-items:center;padding:10px 6px 12px 14px;gap:4px}
.pg .lb{flex:1;font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg .lb small{color:var(--sub2);font-weight:600;font-size:13px}
.pg.check{border-color:var(--warnLine);background:var(--warnBg)}
.pg.check .lb{color:var(--warn);display:flex;align-items:center;gap:6px}
.pg.check .lb i{width:22px;height:22px;border-radius:50%;background:var(--warn);color:#fff;font-style:normal;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.pg .tag{position:absolute;top:8px;left:8px;background:#000000a0;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px}
.pg .tagO{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px}
.insMark{grid-column:1/-1;display:flex;align-items:center;gap:8px;color:var(--warn);font-weight:700;font-size:14px}
.insMark:before,.insMark:after{content:"";flex:1;height:2px;background:var(--warnLine)}
.foot{padding:12px 20px 14px;background:linear-gradient(#f4f5f700,var(--bg) 30%)}
.subhead{padding:0 20px 10px;color:var(--sub);font-size:14px;text-align:center;margin-top:-6px}
/* 검수 */
.sumRow{display:flex;gap:10px;margin-bottom:18px}
.sumRow .card{flex:1;padding:14px 10px;text-align:center}
.sumRow b{display:block;font-size:24px;font-weight:800}
.sumRow span{font-size:13px;color:var(--sub)}
.issue{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px}
.issue .th{width:52px;height:64px;border-radius:8px;background:#eee center/cover;flex:none}
.issue .tx{flex:1;min-width:0}
.issue .tx b{display:block;font-size:16px;font-weight:800}
.issue .tx span{font-size:13px;color:var(--sub);line-height:1.4;display:block;margin-top:2px}
.sbtn{background:#EEF0F3;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.sbtn.r{background:var(--redBg);color:var(--red)}
.groupT{font-size:15px;font-weight:800;color:#4A4F57;margin:18px 2px 10px}
/* 설정 */
.set{padding:6px 0;margin-bottom:16px}
.set .it{padding:14px 18px;border-bottom:1px solid var(--line)}
.set .it:last-child{border-bottom:0}
.set .lb{font-size:16px;font-weight:700;margin-bottom:10px}
.set .ds{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5}
.seg{display:flex;background:#F1F2F4;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 2px;font-size:14px;font-weight:600;border-radius:9px;color:#5c6169}
.seg button.on{background:#fff;color:var(--red);font-weight:800;box-shadow:0 1px 3px #0000001a}
.setRow{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.setH{font-size:14px;font-weight:800;color:var(--sub);margin:8px 6px 8px}
/* 뷰어 */
#viewer{background:#111}
#viewer .top{color:#fff}
#vimg{flex:1;min-height:0;object-fit:contain;width:100%}
.vbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px calc(var(--sb) + 12px);background:#1b1b1d}
.vbar button{color:#fff;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:12px;background:#2a2a2e}
.vbar button svg{width:22px;height:22px}
.vbar button.bad{color:#ff8585}
/* 시트 */
.sheetBg{position:fixed;inset:0;background:#00000059;display:none;z-index:50}
.sheetBg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px calc(var(--sb) + 20px);max-height:88vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#DCDFE3;margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font-size:20px;font-weight:800}
.sheet .sd{color:var(--sub);font-size:14px;line-height:1.55;margin-bottom:12px}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:15px 4px;font-size:17px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.menu button:last-child{border-bottom:0}
.menu button svg{width:22px;height:22px;color:#5c6169;flex:none}
.menu button.bad{color:var(--red)} .menu button.bad svg{color:var(--red)}
.inp{width:100%;font:inherit;font-size:17px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#F7F8FA;color:var(--tx);-webkit-user-select:text;user-select:text;margin:6px 0 14px}
.inp:focus{outline:0;border-color:var(--red)}
.two{display:flex;gap:10px}
.two>*{flex:1}
.prog{height:8px;background:#F0F1F3;border-radius:4px;overflow:hidden;margin:14px 0 8px}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%);background:#15171Ce8;color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:88vw;text-align:center}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100}
#loading.off{display:none}
#loading img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 24px #d0112b40}
.spin{width:22px;height:22px;border:3px solid #e3e5e8;border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<div id="loading"><img src="apple-touch-icon.png" alt=""><div class="spin"></div></div>

<script>
// ===== 비전 코어 (OpenCV.js) =====
function orderQuad(pts) {
  // pts: [{x,y}x4] -> [TL, TR, BR, BL]
  const s = pts.map(p => p.x + p.y), d = pts.map(p => p.y - p.x);
  const tl = pts[s.indexOf(Math.min(...s))], br = pts[s.indexOf(Math.max(...s))];
  const tr = pts[d.indexOf(Math.min(...d))], bl = pts[d.indexOf(Math.max(...d))];
  const set = new Set([tl, tr, br, bl]);
  if (set.size < 4) {
    // 각도 기준 정렬 fallback
    const cx = pts.reduce((a, p) => a + p.x, 0) / 4, cy = pts.reduce((a, p) => a + p.y, 0) / 4;
    const srt = [...pts].sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
    // atan2 정렬: 왼쪽위(-135°)부터 시계방향
    let i0 = 0, best = 1e9;
    srt.forEach((p, i) => { if (p.x + p.y < best) { best = p.x + p.y; i0 = i; } });
    return [0, 1, 2, 3].map(k => srt[(i0 + k) % 4]);
  }
  return [tl, tr, br, bl];
}

function quadArea(q) {
  let a = 0;
  for (let i = 0; i < 4; i++) { const p = q[i], n = q[(i + 1) % 4]; a += p.x * n.y - n.x * p.y; }
  return Math.abs(a) / 2;
}

function matToPts(m) {
  const pts = [];
  for (let i = 0; i < m.rows; i++) pts.push({ x: m.data32S[i * 2], y: m.data32S[i * 2 + 1] });
  return pts;
}

// rgba Mat(작은 해상도) -> 책 외곽 사각형 or null
function detectQuad(src) {
  const W = src.cols, H = src.rows, frameA = W * H;
  const gray = new cv.Mat(), blur = new cv.Mat(), edges = new cv.Mat();
  const contours = new cv.MatVector(), hier = new cv.Mat();
  let best = null, bestA = 0;
  try {
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
    // 중앙값 기반 자동 Canny 임계값
    const med = medianOf(blur);
    const lo = Math.max(10, 0.66 * med * 0.5), hi = Math.min(255, Math.max(40, 1.33 * med * 0.5));
    cv.Canny(blur, edges, lo, hi);
    const k = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
    cv.morphologyEx(edges, edges, cv.MORPH_CLOSE, k);
    k.delete();
    cv.findContours(edges, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    for (let i = 0; i < contours.size(); i++) {
      const c = contours.get(i);
      const a = cv.contourArea(c);
      if (a < frameA * 0.12) { c.delete(); continue; }
      const hull = new cv.Mat();
      cv.convexHull(c, hull, false, true);
      const peri = cv.arcLength(hull, true);
      for (const eps of [0.02, 0.03, 0.045, 0.06, 0.08]) {
        const ap = new cv.Mat();
        cv.approxPolyDP(hull, ap, eps * peri, true);
        if (ap.rows === 4) {
          const q = orderQuad(matToPts(ap));
          const qa = quadArea(q);
          if (qa > bestA && qa < frameA * 0.98) { bestA = qa; best = q; }
          ap.delete(); break;
        }
        ap.delete();
      }
      hull.delete(); c.delete();
    }
  } finally {
    gray.delete(); blur.delete(); edges.delete(); contours.delete(); hier.delete();
  }
  return best;
}

function medianOf(gray) {
  const h = new Array(256).fill(0), d = gray.data;
  for (let i = 0; i < d.length; i += 7) h[d[i]]++;
  const tot = h.reduce((a, b) => a + b, 0); let acc = 0;
  for (let i = 0; i < 256; i++) { acc += h[i]; if (acc >= tot / 2) return i; }
  return 128;
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// 원근 보정: src(풀해상도 rgba) + quad(같은 좌표계) -> 펴진 Mat
function warpQuad(src, q) {
  const w = Math.round(Math.max(dist(q[0], q[1]), dist(q[3], q[2])));
  const h = Math.round(Math.max(dist(q[0], q[3]), dist(q[1], q[2])));
  const s = cv.matFromArray(4, 1, cv.CV_32FC2, [q[0].x, q[0].y, q[1].x, q[1].y, q[2].x, q[2].y, q[3].x, q[3].y]);
  const d = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, w - 1, 0, w - 1, h - 1, 0, h - 1]);
  const M = cv.getPerspectiveTransform(s, d);
  const out = new cv.Mat();
  cv.warpPerspective(src, out, M, new cv.Size(w, h), cv.INTER_CUBIC, cv.BORDER_REPLICATE);
  s.delete(); d.delete(); M.delete();
  return out;
}

function rotateMat(m, deg) {
  if (!deg) return m;
  const out = new cv.Mat();
  const code = deg === 90 ? cv.ROTATE_90_CLOCKWISE : deg === 180 ? cv.ROTATE_180 : cv.ROTATE_90_COUNTERCLOCKWISE;
  cv.rotate(m, out, code);
  m.delete();
  return out;
}

// 가운데 접힘선(제본선) x좌표 찾기: 글자 없는 세로 띠(분산 낮음) 중 가장 어두운 곳
function findGutter(m) {
  const sw = 400, sh = Math.max(20, Math.round(m.rows * sw / m.cols));
  const small = new cv.Mat(), g = new cv.Mat();
  cv.resize(m, small, new cv.Size(sw, sh), 0, 0, cv.INTER_AREA);
  cv.cvtColor(small, g, cv.COLOR_RGBA2GRAY);
  const mean = new Float64Array(sw), sd = new Float64Array(sw);
  const y0 = Math.round(sh * 0.08), y1 = Math.round(sh * 0.92), n = y1 - y0;
  for (let x = 0; x < sw; x++) {
    let s = 0, s2 = 0;
    for (let y = y0; y < y1; y++) { const v = g.data[y * sw + x]; s += v; s2 += v * v; }
    mean[x] = s / n; sd[x] = Math.sqrt(Math.max(0, s2 / n - mean[x] * mean[x]));
  }
  small.delete(); g.delete();
  const smooth = (arr, r) => { const o = new Float64Array(sw); for (let x = 0; x < sw; x++) { let s = 0, c = 0; for (let k = -r; k <= r; k++) { const j = x + k; if (j >= 0 && j < sw) { s += arr[j]; c++; } } o[x] = s / c; } return o; };
  const ms = smooth(mean, 2), ss = smooth(sd, 3);
  const a = Math.round(sw * 0.38), b = Math.round(sw * 0.62);
  const win = [...ss.slice(a, b + 1)];
  const mn = Math.min(...win), med = [...win].sort((p, q) => p - q)[Math.floor(win.length / 2)];
  const thr = mn + 0.35 * (med - mn) + 1;
  // 분산 낮은 구간(run)들
  const runs = []; let st = -1;
  for (let x = a; x <= b + 1; x++) {
    const low = x <= b && ss[x] <= thr;
    if (low && st < 0) st = x;
    if (!low && st >= 0) { runs.push([st, x - 1]); st = -1; }
  }
  let bestX = sw / 2;
  if (runs.length) {
    // 가장 넓은 빈 띠 선택 (동률이면 가운데에 가까운 것)
    runs.sort((p, q) => (q[1] - q[0]) - (p[1] - p[0]) || Math.abs((p[0] + p[1]) / 2 - sw / 2) - Math.abs((q[0] + q[1]) / 2 - sw / 2));
    const [r0, r1] = runs[0];
    let dx = r0, dv = 1e9, sum = 0;
    for (let x = r0; x <= r1; x++) { sum += ms[x]; if (ms[x] < dv) { dv = ms[x]; dx = x; } }
    const avg = sum / (r1 - r0 + 1);
    bestX = (avg - dv > 3) ? dx : (r0 + r1) / 2;
  }
  return Math.round(bestX * m.cols / sw);
}

function enhance(m, mode) {
  if (mode === 'color') return m;
  const g = new cv.Mat();
  cv.cvtColor(m, g, cv.COLOR_RGBA2GRAY);
  if (mode === 'gray') {
    cv.normalize(g, g, 0, 255, cv.NORM_MINMAX);
  } else if (mode === 'bw') {
    const bs = Math.max(15, (Math.round(g.cols / 40) | 1));
    cv.adaptiveThreshold(g, g, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, bs, 15);
  }
  const out = new cv.Mat();
  cv.cvtColor(g, out, cv.COLOR_GRAY2RGBA);
  g.delete(); m.delete();
  return out;
}

// 펴진 양면 Mat -> [Mat,...] 페이지들 (호출자가 delete)
function splitPages(m, mode) {
  if (mode === 'single') return [m];
  const gx = mode === 'center' ? Math.round(m.cols / 2) : findGutter(m);
  const L = m.roi(new cv.Rect(0, 0, gx, m.rows)).clone();
  const R = m.roi(new cv.Rect(gx, 0, m.cols - gx, m.rows)).clone();
  m.delete();
  return [L, R];
}

function resizeMax(m, maxW) {
  if (m.cols <= maxW) return m;
  const out = new cv.Mat();
  cv.resize(m, out, new cv.Size(maxW, Math.round(m.rows * maxW / m.cols)), 0, 0, cv.INTER_AREA);
  m.delete();
  return out;
}


</script>
<script>
// ===== 쪽 번호 추론 =====
// pns: 페이지 순서대로 [{v:number|null, conf, src} | undefined(아직 인식 전)]
// 반환: { items:[{label, status:'ok'|'inferred'|'check'|'none'|'pending', reason}], gaps:[{after, from, to}], dups:[[i,j]], unsorted:bool, stats }
function inferPages(pns) {
  const n = pns.length;
  const det = pns.map(p => (p && p.v != null ? p : null));
  const off = det.map((d, i) => (d ? d.v - i : null));
  const confirmed = new Array(n).fill(false);
  for (let i = 0; i < n; i++) {
    if (!det[i]) continue;
    if (det[i].src === 'manual') { confirmed[i] = true; continue; }
    let support = 0, others = 0;
    for (let j = Math.max(0, i - 4); j <= Math.min(n - 1, i + 4); j++) {
      if (j === i || !det[j]) continue;
      others++;
      if (off[j] === off[i]) support++;
    }
    if (support > 0) confirmed[i] = true;
    else if (others === 0 && det[i].conf >= 75) confirmed[i] = true; // 주변에 비교할 게 없는 단독 인식
  }
  const nearest = (i, dir) => { for (let j = i + dir; j >= 0 && j < n; j += dir) if (confirmed[j]) return j; return -1; };
  const items = [];
  for (let i = 0; i < n; i++) {
    const p = pns[i];
    if (p === undefined) { items.push({ label: null, status: 'pending', reason: '' }); continue; }
    if (confirmed[i]) { items.push({ label: det[i].v, status: 'ok', reason: '' }); continue; }
    const L = nearest(i, -1), R = nearest(i, 1);
    const oL = L >= 0 ? off[L] : null, oR = R >= 0 ? off[R] : null;
    if (det[i]) {
      items.push({ label: det[i].v, status: 'check', kind: 'misread', reason: '인식한 번호가 앞뒤 페이지와 안 맞아' });
    } else if (oL != null && oR != null) {
      if (oL === oR) items.push({ label: i + oL, status: 'inferred', reason: '' });
      else items.push({ label: i + oL, status: 'check', kind: 'unknown', reason: '번호를 못 읽었고 앞뒤 사이가 안 맞아' });
    } else if (oL != null || oR != null) {
      items.push({ label: i + (oL != null ? oL : oR), status: 'inferred', reason: '' });
    } else items.push({ label: null, status: 'none', reason: '' });
  }
  // 음수/0 라벨은 무효
  items.forEach(it => { if (it.label != null && it.label < 1) { it.label = null; if (it.status === 'inferred') it.status = 'none'; } });
  // 중복 / 역순 / 빠짐
  const gaps = [], dups = [], seen = new Map();
  let unsorted = false, prev = -1;
  for (let i = 0; i < n; i++) {
    const it = items[i];
    if (it.label == null) continue;
    if (seen.has(it.label) && it.status !== 'check') {
      dups.push([seen.get(it.label), i]);
      it.status = 'check'; it.kind = 'dup'; it.reason = '같은 페이지가 두 번 찍힌 것 같아';
      continue;
    }
    if (it.status === 'check') continue;
    if (prev >= 0 && it.label < items[prev].label) {
      unsorted = true; it.status = 'check'; it.kind = 'order'; it.reason = '앞 페이지보다 번호가 작아 (순서 뒤바뀜)';
      seen.set(it.label, i);
      continue;
    }
    seen.set(it.label, i); prev = i;
  }
  // 빠진 번호: 믿을 만한(확인 필요 아닌) 번호들 기준
  const present = new Set(), where = new Map();
  items.forEach((it, i) => { if (it.label != null && (it.status !== 'check' || it.kind === 'order' || it.kind === 'dup')) { if (!where.has(it.label) || it.kind !== 'dup') where.set(it.label, i); present.add(it.label); } });
  if (present.size) {
    const lo = Math.min(...present), hi = Math.max(...present);
    let st = null;
    for (let v = lo; v <= hi + 1; v++) {
      const miss = v <= hi && !present.has(v);
      if (miss && st == null) st = v;
      if (!miss && st != null) {
        if (v - st <= 60) gaps.push({ after: where.get(st - 1), from: st, to: v - 1 });
        st = null;
      }
    }
  }
  const stats = { total: n, pending: 0, ok: 0, inferred: 0, check: 0, none: 0 };
  items.forEach(it => stats[it.status]++);
  return { items, gaps, dups, unsorted, stats };
}

// 검출 단어들 중 쪽 번호 후보 고르기. words: [{text, confidence, bbox:{x0,x1,y0,y1}}], W: 크롭 폭, pos: 'bottom'|'top'
function pickPageNumber(words, W, pos) {
  const out = [];
  for (const w of words || []) {
    const raw = (w.text || '').trim();
    const t = raw.replace(/[-–—.·,()\[\]\s|]/g, '');
    if (!/^\d{1,4}$/.test(t)) continue;
    const v = +t; if (!v) continue;
    const cx = (w.bbox.x0 + w.bbox.x1) / 2 / W;
    const edge = cx < 0.25 || cx > 0.75 ? 1 : (cx > 0.38 && cx < 0.62 ? 0.95 : 0.5);
    out.push({ v, conf: w.confidence, score: w.confidence * edge * (pos === 'bottom' ? 1 : 0.92) });
  }
  out.sort((a, b) => b.score - a.score);
  return out[0] || null;
}

function renderBanner() {

  if (st.pending) { const done = st.total - st.pending; el.innerHTML = `<div class="banner run"><div class="bi"><span class="spin" style="border-color:#ffffff55;border-top-color:#fff"></span></div><div style="flex:1"><b>페이지 번호 인식 중… ${done}/${st.total}</b><span>각 페이지 번호를 읽어서 순서를 확인하고 있어요.</span><div class="prog" style="margin:8px 0 0;height:5px"><i style="width:${done / st.total * 100}%"></i></div></div></div>`; return; }
  const issues = st.check + inferRes.gaps.length;

  ]);

      $('oTxt').textContent = `${i + 1}번째 장 완료 (${((Date.now() - t0) / 1000).toFixed(0)}초) · ${done}/${order.length}`;
    }
    $('oTxt').textContent = ocrStop ? `멈춤 · ${done}/${order.length}쪽 완료 (다음에 이어서 돼)` : '전부 완료! PDF 만들면 검색 가능한 PDF로 나와.';
  } catch (e) { $('oTxt').textContent = 'OCR 실패: ' + e.message; }
  try { worker && await worker.terminate(); } catch (e) {}
  ocrRunning = false; sheetLocked = false; dropWake();
  $('oClose').textContent = '닫기'; $('oClose').onclick = () => { closeSheet(); refreshCur(); };
  pnKick();
}

// ================= 시작 =================
(async () => {
  try { await openDB(); } catch (e) { document.querySelector('#loading').innerHTML = '<div style="padding:30px;text-align:center">저장소를 못 열었어: ' + esc(e.message) + '</div>'; return; }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const lb = lastBookId(); if (lb) curBook = (await getBook(lb)) || null;
  await renderHome();
  $('loading').classList.add('off');
  initCV().catch(() => {});
  setTimeout(pnKick, 1500);
})();
</script>
</body>
